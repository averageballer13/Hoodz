# Hoodz - Foundry configuration
# Robinhood Chain (EVM, Cancun opcodes) - mainnet 4663 / testnet 46630

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
via_ir = false
auto_detect_solc = false
ffi = false
# script/Deploy.s.sol writes deployments/<chainid>.json and deployments/pons-launch.json
fs_permissions = [{access = "read-write", path = "./"}]
gas_reports = ["*"]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
  "ds-test/=lib/forge-std/lib/ds-test/src/"
]

[profile.ci]
verbosity = 3
fuzz = { runs = 4096 }

[profile.lite]
optimizer = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Blockscout verification. `forge verify-contract --verifier blockscout` also works;
# these named entries let you use `--chain robinhood` / `--chain robinhood_testnet`.
[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", chain = 46630, url = "https://testnet.robinhoodchain.blockscout.com/api" }
